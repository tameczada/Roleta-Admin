services:
  - type: web
    name: roleta-admin
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_SECRET
        generateValue: true   # Render gera automaticamente — copie depois em Dashboard > Environment
      - key: FRONTEND_URL
        value: https://luyan-tamec.github.io/roleta-leoeisa
      - key: BACKEND_URL
        fromService:
          type: web
          name: roleta-admin
          property: host
